name: Build OAF for iStoreOS 25.12

run-name: Build OAF for iStoreOS 25.12 (latest)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ISTOREOS_REPO: https://github.com/istoreos/istoreos.git
  ISTOREOS_BRANCH: istoreos-25.12

jobs:
  build:
    name: Build OAF for iStoreOS 25.12 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ------------------------------------------------------------
      # 1. Checkout your OAF fork
      # ------------------------------------------------------------
      - name: Checkout OAF source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Install OpenWrt / iStoreOS build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            curl \
            file \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      # ------------------------------------------------------------
      # 3. Clone the LATEST iStoreOS 25.12 source
      #
      # Do NOT hard-code:
      #   6.12.94
      #   kernel ABI
      #   25.12.5
      #
      # Every manual run gets the current tip of istoreos-25.12.
      # ------------------------------------------------------------
      - name: Checkout latest iStoreOS 25.12
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            "${ISTOREOS_REPO}" \
            "${RUNNER_TEMP}/istoreos"

          cd "${RUNNER_TEMP}/istoreos"

          echo "iStoreOS commit:"
          git rev-parse HEAD

          echo "iStoreOS branch:"
          git branch --show-current

      # ------------------------------------------------------------
      # 4. Configure x86_64 target
      # ------------------------------------------------------------
      - name: Configure iStoreOS x86_64
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          # Use iStoreOS x86_64 target.
          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_appfilter=m
          CONFIG_PACKAGE_kmod-oaf=m
          CONFIG_PACKAGE_luci-app-oaf=m
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=m
          EOF

          make defconfig

          echo
          echo "===== Target configuration ====="
          grep -E '^CONFIG_TARGET_x86(_64)?=' .config || true
          grep -E '^CONFIG_TARGET_x86_64_DEVICE_' .config || true

          echo
          echo "===== OAF configuration ====="
          grep -E '^CONFIG_PACKAGE_(appfilter|kmod-oaf|luci-app-oaf|luci-i18n-oaf-zh-cn)=' .config

      # ------------------------------------------------------------
      # 5. Update iStoreOS feeds
      # ------------------------------------------------------------
      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # 6. Replace any feed-provided OAF with your fork
      #
      # Your repository contains:
      #   oaf/
      #   open-app-filter/
      #   luci-app-oaf/
      #
      # This follows the structure of the existing OAF workflow.
      # ------------------------------------------------------------
      - name: Install OAF source
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$ISTOREOS_DIR"

          # Remove the feed version if iStoreOS/packages provides it.
          ./scripts/feeds uninstall open-app-filter || true

          if [[ -e package/feeds/packages/open-app-filter || \
                -L package/feeds/packages/open-app-filter ]]; then
            echo "::error::Feed-provided open-app-filter still exists"
            exit 1
          fi

          package_dir="$ISTOREOS_DIR/package/OpenAppFilter"

          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          cp -a "$GITHUB_WORKSPACE/oaf" \
            "$package_dir/"

          cp -a "$GITHUB_WORKSPACE/open-app-filter" \
            "$package_dir/"

          cp -a "$GITHUB_WORKSPACE/luci-app-oaf" \
            "$package_dir/"

          echo "Installed OAF source:"
          find "$package_dir" -maxdepth 2 -type f | sort

      # ------------------------------------------------------------
      # 7. Re-run defconfig after adding OAF packages
      # ------------------------------------------------------------
      - name: Finalize configuration
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          make defconfig

          for symbol in \
            CONFIG_PACKAGE_appfilter \
            CONFIG_PACKAGE_kmod-oaf \
            CONFIG_PACKAGE_luci-app-oaf \
            CONFIG_PACKAGE_luci-i18n-oaf-zh-cn
          do
            if ! grep -Eq "^${symbol}=[my]$" .config; then
              echo "::error::${symbol} was not enabled"
              exit 1
            fi
          done

          echo
          echo "===== Final OAF configuration ====="
          grep -E '^CONFIG_PACKAGE_(appfilter|kmod-oaf|luci-app-oaf|luci-i18n-oaf-zh-cn)=' .config

      # ------------------------------------------------------------
      # 8. Build the packages
      #
      # The iStoreOS build system determines the current kernel
      # version / kernel package ABI itself.
      # Nothing is hard-coded here.
      # ------------------------------------------------------------
      - name: Compile OAF packages
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          make \
            --jobs="$(nproc)" \
            V=s \
            package/OpenAppFilter/oaf/compile \
            package/OpenAppFilter/open-app-filter/compile \
            package/OpenAppFilter/luci-app-oaf/compile

      # ------------------------------------------------------------
      # 9. Collect APK packages
      # ------------------------------------------------------------
      - name: Collect OAF APK packages
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/apk"

          find "$ISTOREOS_DIR/bin" \
            -type f \
            \( \
              -name 'appfilter-*.apk' -o \
              -name 'kmod-oaf-*.apk' -o \
              -name 'luci-app-oaf-*.apk' -o \
              -name 'luci-i18n-oaf-zh-cn*.apk' \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/apk/" \;

          echo "===== Generated APK packages ====="
          ls -lh "$GITHUB_WORKSPACE/dist/apk"

      # ------------------------------------------------------------
      # 10. Verify that exactly one package of each type exists
      # ------------------------------------------------------------
      - name: Verify APK packages
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist/apk"

          for pattern in \
            'appfilter-*.apk' \
            'kmod-oaf-*.apk' \
            'luci-app-oaf-*.apk' \
            'luci-i18n-oaf-zh-cn*.apk'
          do
            count=$(find . -maxdepth 1 -type f -name "$pattern" | wc -l)

            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one $pattern package, found $count"
              exit 1
            fi
          done

      # ------------------------------------------------------------
      # 11. Extract the kernel ABI from the generated kmod-oaf APK
      #
      # APK packages contain .PKGINFO.
      # We do NOT hard-code the current kernel ABI.
      # ------------------------------------------------------------
      - name: Verify kmod-oaf kernel dependency
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist/apk"

          kmod_apk="$(find . -maxdepth 1 -type f -name 'kmod-oaf-*.apk' -print -quit)"

          if [[ -z "$kmod_apk" ]]; then
            echo "::error::kmod-oaf APK not found"
            exit 1
          fi

          echo "===== kmod-oaf package ====="
          echo "$kmod_apk"

          echo
          echo "===== APK metadata ====="

          tar -xOf "$kmod_apk" .PKGINFO > /tmp/oaf.pkginfo

          cat /tmp/oaf.pkginfo

          actual_kernel_dep="$(
            sed -n 's/^depend = \(kernel=.*\)$/\1/p' \
              /tmp/oaf.pkginfo \
              | head -n 1
          )"

          if [[ -z "$actual_kernel_dep" ]]; then
            echo "::error::Unable to determine kmod-oaf kernel dependency"
            exit 1
          fi

          echo
          echo "Generated kmod-oaf dependency:"
          echo "$actual_kernel_dep"

          # Find the kernel package generated by the SAME iStoreOS build.
          kernel_apk="$(
            find "$ISTOREOS_DIR/bin" \
              -type f \
              -name 'kernel-*.apk' \
              -print \
              | head -n 1
          )"

          if [[ -z "$kernel_apk" ]]; then
            echo "::warning::Kernel APK was not generated in bin/"
            echo "The kmod-oaf dependency will still be recorded."
          else
            echo
            echo "Kernel APK:"
            echo "$kernel_apk"

            tar -xOf "$kernel_apk" .PKGINFO > /tmp/kernel.pkginfo

            expected_kernel_dep="$(
              awk -F': ' '
                /^pkgname = kernel$/ {
                  found=1
                }
                found && /^pkgver = / {
                  print "kernel=" $2
                  exit
                }
              ' /tmp/kernel.pkginfo
            )"

            if [[ -z "$expected_kernel_dep" ]]; then
              echo "::error::Unable to determine kernel package version"
              exit 1
            fi

            echo
            echo "Kernel package version:"
            echo "$expected_kernel_dep"

            if [[ "$actual_kernel_dep" != "$expected_kernel_dep" ]]; then
              echo
              echo "::error::KERNEL ABI MISMATCH"
              echo "kmod-oaf: $actual_kernel_dep"
              echo "kernel:    $expected_kernel_dep"
              exit 1
            fi

            echo
            echo "Kernel ABI check: PASS"
          fi

          # Also record the running build's kernel version from the
          # generated kmod package filename.
          kmod_name="$(basename "$kmod_apk")"

          echo
          echo "===== kmod-oaf filename ====="
          echo "$kmod_name"

      # ------------------------------------------------------------
      # 12. Generate checksums and build information
      # ------------------------------------------------------------
      - name: Generate build information
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist"

          istoreos_commit="$(
            git -C "$ISTOREOS_DIR" rev-parse HEAD
          )"

          istoreos_date="$(
            git -C "$ISTOREOS_DIR" show -s \
              --format='%ci' HEAD
          )"

          oaf_version="$(
            awk -F ':=' '
              /^PKG_VERSION:=/ {
                gsub(/[[:space:]]/, "", $2)
                print $2
                exit
              }
            ' "$GITHUB_WORKSPACE/open-app-filter/Makefile"
          )"

          {
            echo "OpenAppFilter version: ${oaf_version}"
            echo "OpenAppFilter commit: ${GITHUB_SHA}"
            echo
            echo "iStoreOS branch: ${ISTOREOS_BRANCH}"
            echo "iStoreOS commit: ${istoreos_commit}"
            echo "iStoreOS commit date: ${istoreos_date}"
            echo
            echo "Target: x86/64"
            echo
            echo "Packages:"
            find apk \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -printf '%f\n' \
              | sort
          } > build-info.txt

          sha256sum apk/*.apk > SHA256SUMS

          echo "===== Build information ====="
          cat build-info.txt

          echo
          echo "===== SHA256 ====="
          cat SHA256SUMS

      # ------------------------------------------------------------
      # 13. Upload the final artifacts
      # ------------------------------------------------------------
      - name: Upload OAF packages
        uses: actions/upload-artifact@v4
        with:
          name: oaf-istoreos-25.12-x86_64
          path: |
            dist/apk/*.apk
            dist/build-info.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
