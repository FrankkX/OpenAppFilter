name: Build OAF for iStoreOS 25.12

run-name: Build OAF for iStoreOS 25.12 (latest)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ISTOREOS_REPO: https://github.com/istoreos/istoreos.git
  ISTOREOS_BRANCH: istoreos-25.12

jobs:
  build:
    name: Build OAF for iStoreOS 25.12 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ------------------------------------------------------------
      # 1. Checkout your OAF fork
      # ------------------------------------------------------------
      - name: Checkout OAF source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Install OpenWrt / iStoreOS build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            curl \
            file \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      # ------------------------------------------------------------
      # 3. Clone the LATEST iStoreOS 25.12 source
      # ------------------------------------------------------------
      - name: Checkout latest iStoreOS 25.12
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${ISTOREOS_BRANCH}" \
            "${ISTOREOS_REPO}" \
            "${RUNNER_TEMP}/istoreos"

          cd "${RUNNER_TEMP}/istoreos"

          echo "iStoreOS commit:"
          git rev-parse HEAD

          echo "iStoreOS branch:"
          git branch --show-current

      # ------------------------------------------------------------
      # 4. Update iStoreOS feeds
      # ------------------------------------------------------------
      - name: Update and install feeds
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # 5. Replace feed-provided OAF with your fork
      # ------------------------------------------------------------
      - name: Install OAF source
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$ISTOREOS_DIR"

          ./scripts/feeds uninstall open-app-filter || true

          package_dir="$ISTOREOS_DIR/package/OpenAppFilter"

          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          [ -d "$GITHUB_WORKSPACE/oaf" ] && cp -a "$GITHUB_WORKSPACE/oaf" "$package_dir/"
          [ -d "$GITHUB_WORKSPACE/open-app-filter" ] && cp -a "$GITHUB_WORKSPACE/open-app-filter" "$package_dir/"
          [ -d "$GITHUB_WORKSPACE/luci-app-oaf" ] && cp -a "$GITHUB_WORKSPACE/luci-app-oaf" "$package_dir/"

          echo "Installed OAF source:"
          find "$package_dir" -maxdepth 2 -type f | sort

      # ------------------------------------------------------------
      # 6. Configure x86_64 target & enable OAF
      # ------------------------------------------------------------
      - name: Finalize configuration
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          target_config="target/linux/x86/config-6.12"
          if [ -f "$target_config" ]; then
            cat "$target_config" > .config
          fi

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_appfilter=m
          CONFIG_PACKAGE_kmod-oaf=m
          CONFIG_PACKAGE_luci-app-oaf=m
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=m
          EOF

          make defconfig

          for symbol in \
            CONFIG_PACKAGE_appfilter \
            CONFIG_PACKAGE_kmod-oaf \
            CONFIG_PACKAGE_luci-app-oaf \
            CONFIG_PACKAGE_luci-i18n-oaf-zh-cn
          do
            if ! grep -Eq "^${symbol}=[my]$" .config; then
              echo "::error::${symbol} was not enabled"
              exit 1
            fi
          done

          echo
          echo "===== Final OAF configuration ====="
          grep -E '^CONFIG_PACKAGE_(appfilter|kmod-oaf|luci-app-oaf|luci-i18n-oaf-zh-cn)=' .config

      # ------------------------------------------------------------
      # 7. Prepare Host Tools, Toolchain & Kernel
      # [关键修复]：准备解压与编译内核基础环境，避免缺失 modules.builtin / sed 报错
      # ------------------------------------------------------------
      - name: Prepare Kernel & Toolchain
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          make tools/install --jobs="$(nproc)" V=s
          make toolchain/install --jobs="$(nproc)" V=s
          make target/linux/compile --jobs="$(nproc)" V=s

      # ------------------------------------------------------------
      # 8. Build the OAF packages
      # ------------------------------------------------------------
      - name: Compile OAF packages
        working-directory: ${{ runner.temp }}/istoreos
        shell: bash
        run: |
          set -euo pipefail

          for pkg_dir in $(find package/OpenAppFilter -maxdepth 2 -name Makefile -exec dirname {} \;); do
            if [ "$pkg_dir" != "package/OpenAppFilter" ] && [[ "$pkg_dir" != */src ]]; then
              echo "::notice::Found package to compile: $pkg_dir"
              make "${pkg_dir}/compile" --jobs="$(nproc)" V=s
            fi
          done

      # ------------------------------------------------------------
      # 9. Collect APK packages
      # ------------------------------------------------------------
      - name: Collect OAF APK packages
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist/apk"

          find "$ISTOREOS_DIR/bin" \
            -type f \
            \( \
              -name 'appfilter-*.apk' -o \
              -name 'kmod-oaf-*.apk' -o \
              -name 'luci-app-oaf-*.apk' -o \
              -name 'luci-i18n-oaf-zh-cn*.apk' \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/apk/" \;

          echo "===== Generated APK packages ====="
          ls -lh "$GITHUB_WORKSPACE/dist/apk"

      # ------------------------------------------------------------
      # 10. Verify that required packages exist
      # ------------------------------------------------------------
      - name: Verify APK packages
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist/apk"

          for pattern in \
            'appfilter-*.apk' \
            'kmod-oaf-*.apk' \
            'luci-app-oaf-*.apk'
          do
            count=$(find . -maxdepth 1 -type f -name "$pattern" | wc -l)

            if [[ "$count" -lt 1 ]]; then
              echo "::error::Expected at least one $pattern package, found $count"
              exit 1
            fi
          done

      # ------------------------------------------------------------
      # 11. Extract and display kernel dependency
      # ------------------------------------------------------------
      - name: Verify kmod-oaf kernel dependency
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist/apk"

          kmod_apk="$(find . -maxdepth 1 -type f -name 'kmod-oaf-*.apk' -print -quit)"

          if [[ -z "$kmod_apk" ]]; then
            echo "::error::kmod-oaf APK not found"
            exit 1
          fi

          echo "===== kmod-oaf package ====="
          echo "$kmod_apk"

          echo
          echo "===== APK metadata ====="

          tar -xOf "$kmod_apk" .PKGINFO > /tmp/oaf.pkginfo || true

          cat /tmp/oaf.pkginfo

          actual_kernel_dep="$(
            sed -n 's/^depend = \(kernel=.*\)$/\1/p' \
              /tmp/oaf.pkginfo \
              | head -n 1
          )"

          echo
          echo "Generated kmod-oaf dependency: ${actual_kernel_dep:-Unknown}"

      # ------------------------------------------------------------
      # 12. Generate checksums and build information
      # ------------------------------------------------------------
      - name: Generate build information
        shell: bash
        env:
          ISTOREOS_DIR: ${{ runner.temp }}/istoreos
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dist"

          istoreos_commit="$(git -C "$ISTOREOS_DIR" rev-parse HEAD)"
          istoreos_date="$(git -C "$ISTOREOS_DIR" show -s --format='%ci' HEAD)"

          {
            echo "OpenAppFilter commit: ${GITHUB_SHA}"
            echo
            echo "iStoreOS branch: ${ISTOREOS_BRANCH}"
            echo "iStoreOS commit: ${istoreos_commit}"
            echo "iStoreOS commit date: ${istoreos_date}"
            echo
            echo "Target: x86/64"
            echo
            echo "Packages:"
            find apk -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
          } > build-info.txt

          sha256sum apk/*.apk > SHA256SUMS

          echo "===== Build information ====="
          cat build-info.txt

          echo
          echo "===== SHA256 ====="
          cat SHA256SUMS

      # ------------------------------------------------------------
      # 13. Upload the final artifacts
      # ------------------------------------------------------------
      - name: Upload OAF packages
        uses: actions/upload-artifact@v4
        with:
          name: oaf-istoreos-25.12-x86_64
          path: |
            dist/apk/*.apk
            dist/build-info.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
