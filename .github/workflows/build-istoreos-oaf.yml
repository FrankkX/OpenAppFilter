name: Build OAF for iStoreOS 25.12

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build target: x64=x86/64"
        required: true
        default: x64
        type: choice
        options:
          - x64

permissions:
  contents: read

# 设定 iStoreOS 25.12 固件期望的准确 Vermagic
env:
  TARGET_ISTOREOS_VERMAGIC: "Q1Ru/OQBD47xuvJGcWZ2rwve+B2IQ="

jobs:
  build:
    name: Build OAF on iStoreOS 25.12 Source
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out OAF source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl file flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libelf-dev \
            libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip wget zlib1g-dev zstd

      - name: Clone iStoreOS Source Code
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch -b istoreos-25.12 https://github.com/istoreos/istoreos.git istoreos_src

      - name: Update and Install Feeds & Source
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos_src
          
          # 1. 更新与安装 iStoreOS 官方 feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. 将 OAF 源码放置到 package/OpenAppFilter 目录下
          package_dir="package/OpenAppFilter"
          mkdir -p "$package_dir"

          if [ -d "$GITHUB_WORKSPACE/luci-app-oaf" ]; then cp -a "$GITHUB_WORKSPACE/luci-app-oaf" "$package_dir/"; fi
          if [ -d "$GITHUB_WORKSPACE/oaf" ]; then cp -a "$GITHUB_WORKSPACE/oaf" "$package_dir/"; fi
          if [ -d "$GITHUB_WORKSPACE/open-app-filter" ]; then cp -a "$GITHUB_WORKSPACE/open-app-filter" "$package_dir/"; fi
          
          if [ -f "$GITHUB_WORKSPACE/Makefile" ] && [ ! -d "$package_dir/open-app-filter" ] && [ ! -d "$package_dir/oaf" ]; then
            cp -a "$GITHUB_WORKSPACE" "$package_dir/open-app-filter"
          fi

      - name: Configure Target & Vermagic
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos_src

          # 加载 x86/64 目标默认配置
          target_config="target/linux/x86/config-6.12"
          if [ -f "$target_config" ]; then
            cat "$target_config" > .config
          fi

          # 写入构建 OAF 所需的宏开关以及强制 Vermagic 配置
          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_appfilter=m
          CONFIG_PACKAGE_kmod-oaf=m
          CONFIG_PACKAGE_luci-app-oaf=m
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=m
          CONFIG_EXTERNAL_KERNEL_TREE_VERMAGIC="${TARGET_ISTOREOS_VERMAGIC}"
          EOF

          make defconfig

      - name: Prepare Kernel & Toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos_src

          make tools/install V=s -j$(nproc)
          make toolchain/install V=s -j$(nproc)
          make target/linux/compile V=s -j$(nproc)

      - name: Compile OAF Packages
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos_src

          found_pkg=0
          for pkg_dir in $(find package/OpenAppFilter -maxdepth 2 -name Makefile -exec dirname {} \;); do
            if [ "$pkg_dir" != "package/OpenAppFilter" ] && [[ "$pkg_dir" != */src ]]; then
              echo "::notice::Found package to compile: $pkg_dir"
              make "${pkg_dir}/compile" V=s -j$(nproc)
              found_pkg=1
            fi
          done

          if [ "$found_pkg" -eq 0 ]; then
            echo "::error::No valid OpenWrt package Makefile found in package/OpenAppFilter!"
            exit 1
          fi

      - name: Organize Artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/dist/x64"
          mkdir -p "$artifact_dir"

          # 只精准提取 OAF 相关的四个安装包，剔除其他系统内核包
          while IFS= read -r -d '' package; do
            cp "$package" "$artifact_dir/"
          done < <(
            find istoreos_src/bin/ -type f \
              \( \
                -name 'appfilter-*.apk' -o \
                -name 'kmod-oaf-*.apk' -o \
                -name 'luci-app-oaf-*.apk' -o \
                -name 'luci-i18n-oaf-*.apk' \
              \) \
              -print0
          )

          # 生成校验和
          (
            cd "$artifact_dir"
            sha256sum * > SHA256SUMS 2>/dev/null || true
          )

          echo "path=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-istoreos-25.12-x64
          path: ${{ steps.artifacts.outputs.path }}
          if-no-files-found: error
